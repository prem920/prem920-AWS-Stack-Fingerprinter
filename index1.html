<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Stack Fingerprinter — Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.08);
      --border-med: rgba(255,255,255,0.14);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #555;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;

      --success-bg: #0a1f0f;
      --success-border: rgba(34,197,94,0.25);
      --success-text: #4ade80;

      --warning-bg: #1a1200;
      --warning-border: rgba(234,179,8,0.25);
      --warning-text: #facc15;

      --danger-bg: #190808;
      --danger-border: rgba(239,68,68,0.25);
      --danger-text: #f87171;

      --info-bg: #071323;
      --info-border: rgba(96,165,250,0.25);
      --info-text: #93c5fd;
    }

    html, body { background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px; line-height: 1.6; min-height: 100vh; }

    #root { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 0 14px;
      height: 38px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input[type="text"]::placeholder { color: var(--text-tertiary); }
    input[type="text"]:focus { border-color: var(--border-med); box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }
    input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }

    button {
      background: transparent;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      height: 38px;
      padding: 0 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.1s, opacity 0.1s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .label-mono {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 8px 16px; text-align: left; font-size: 10px; font-weight: 400; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 0.5px solid var(--border); }
    td { padding: 10px 16px; border-bottom: 0.5px solid var(--border); vertical-align: top; line-height: 1.4; }
    tr:last-child td { border-bottom: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .badge-easy { background: var(--success-bg); border: 0.5px solid var(--success-border); color: var(--success-text); }
    .badge-medium { background: var(--warning-bg); border: 0.5px solid var(--warning-border); color: var(--warning-text); }
    .badge-hard { background: var(--danger-bg); border: 0.5px solid var(--danger-border); color: var(--danger-text); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      background: var(--info-bg);
      border: 0.5px solid var(--info-border);
      color: var(--info-text);
    }

    .ai-section p { font-size: 13px; color: var(--text-secondary); margin: 3px 0; line-height: 1.6; }
    .ai-section .ai-heading { font-size: 13px; font-weight: 500; color: var(--text-primary); margin: 12px 0 4px; }
    .ai-section .ai-heading:first-child { margin-top: 0; }
    .ai-section .bullet { display: flex; gap: 8px; margin: 3px 0; font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
    .ai-section .bullet-dash { color: var(--text-tertiary); flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useCallback } = React;

    const FPS = [
      { id:'beanstalk',  re:/\.elasticbeanstalk\.com/i,                         name:'Elastic Beanstalk',    diff:'easy',   note:'Direct PaaS swap. Top priority migration profile.' },
      { id:'amplify',    re:/\.amplifyapp\.com/i,                                name:'AWS Amplify',          diff:'easy',   note:'Managed hosting layer — strong Render candidate.' },
      { id:'s3static',   re:/s3-website/i,                                       name:'S3 Static Hosting',    diff:'easy',   note:'Clean migration to Render static sites.' },
      { id:'lightsail',  re:/lightsail/i,                                        name:'Lightsail',            diff:'easy',   note:'AWS managed VPS. Simple migration path.' },
      { id:'alb',        re:/\.elb\.amazonaws\.com/i,                            name:'ELB / ALB',            diff:'easy',   note:'Load balancer visible. Investigate compute behind it.' },
      { id:'s3',         re:/\.s3\.amazonaws\.com/i,                             name:'S3',                   diff:'easy',   note:'Likely static hosting or CDN origin.' },
      { id:'cloudfront', re:/\.cloudfront\.net/i,                                name:'CloudFront',           diff:'medium', note:'CDN layer — identify origin to qualify (static vs compute).' },
      { id:'apigateway', re:/\.execute-api\.[a-z0-9-]+\.amazonaws\.com/i,        name:'API Gateway',          diff:'hard',   note:'Lambda-backed. No Render serverless equivalent.' },
      { id:'eks',        re:/\.eks\.amazonaws\.com/i,                            name:'EKS (Kubernetes)',     diff:'hard',   note:'Active K8s investment. Not a near-term target.' },
      { id:'globalaccel',re:/\.awsglobalaccelerator\.com/i,                      name:'Global Accelerator',   diff:'hard',   note:"Multi-region active/active. Render doesn't support this." },
      { id:'awsgeneric', re:/\.amazonaws\.com/i,                                 name:'AWS (unspecified)',    diff:'medium', note:'Generic AWS resource. Needs discovery to identify.' },
    ];

    const SUBS = ['','www','api','app','portal','admin','staging','dev','prod','backend','static','cdn','assets','auth','secure','worker','jobs','media'];

    async function dnsq(name, type) {
      try {
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`, { headers: { Accept: 'application/dns-json' } });
        if (!r.ok) return [];
        return (await r.json()).Answer || [];
      } catch { return []; }
    }

    function scoreIt(findings) {
      if (!findings.length) return { label: 'No AWS detected', variant: 'neutral', desc: 'No AWS fingerprints found in public DNS. May use a different cloud or CDN obfuscation is hiding the stack.' };
      const has = id => findings.some(f => f.id === id);
      const any = d => findings.some(f => f.diff === d);
      if (has('beanstalk'))                        return { label: 'Prime target',               variant: 'success', desc: 'Elastic Beanstalk confirmed — direct PaaS-to-PaaS swap. Highest priority migration profile.' };
      if (has('eks') || has('globalaccel'))        return { label: 'Poor fit',                   variant: 'danger',  desc: 'Kubernetes or multi-region infrastructure detected. Migration would require significant re-architecture.' };
      if (has('apigateway') && !any('easy'))       return { label: 'Poor fit',                   variant: 'danger',  desc: 'API Gateway detected — likely serverless-first. No Render equivalent for Lambda.' };
      if (any('hard') && any('easy'))              return { label: 'Investigate',                variant: 'warning', desc: 'Mixed signals — easy wins alongside hard blockers. Discovery call needed to understand full stack.' };
      if (any('easy') && !any('hard'))             return { label: 'Strong candidate',           variant: 'success', desc: 'Clean profile. Mostly replaceable AWS services visible in public DNS.' };
      return                                              { label: 'Investigate',                variant: 'warning', desc: "AWS confirmed but compute layer isn't exposed in DNS. Run a discovery call." };
    }

    async function getAI(domain, findings, meta) {
      const services = findings.length
        ? findings.map(f => `- ${f.subdomain}: ${f.name} (${f.diff} difficulty) — ${f.note}`).join('\n')
        : 'No AWS services detected in public DNS.';
      const prompt = `You're a senior enterprise AE at Render.com, a cloud infrastructure platform.

Domain: ${domain}
Route 53: ${meta.route53 ? 'Yes' : 'No'} | AWS SES: ${meta.ses ? 'Yes' : 'No'}

Detected AWS services (public DNS only):
${services}

Write a sharp sales analysis in exactly 3 labeled sections:
**Verdict** (1 sentence): Is this a qualified Render migration prospect right now?
**Key signals** (2-3 bullets): What do these findings tell us about their stack and migration likelihood?
**Opening angle** (2-3 bullets): How should you open the outbound conversation? What pain to lead with?

No fluff. Write like a senior AE who knows Render's competitive advantages cold.`;
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 800, messages: [{ role: 'user', content: prompt }] })
      });
      const d = await r.json();
      return d.content?.[0]?.text || '';
    }

    function Badge({ diff }) {
      return <span className={`badge badge-${diff}`}>{diff}</span>;
    }

    function VerdictCard({ verdict }) {
      const colorMap = { success: 'var(--success-text)', warning: 'var(--warning-text)', danger: 'var(--danger-text)', neutral: 'var(--text-tertiary)' };
      const bgMap    = { success: 'var(--success-bg)',   warning: 'var(--warning-bg)',   danger: 'var(--danger-bg)',   neutral: 'var(--surface2)' };
      const bdMap    = { success: 'var(--success-border)',warning: 'var(--warning-border)',danger:'var(--danger-border)',neutral: 'var(--border)' };
      return (
        <div style={{ background: bgMap[verdict.variant], border: `0.5px solid ${bdMap[verdict.variant]}`, borderRadius: 'var(--radius-lg)', padding: '1rem 1.25rem', marginBottom: 10 }}>
          <p className="label-mono" style={{ marginBottom: 6 }}>Migration readiness</p>
          <p style={{ fontSize: 22, fontWeight: 500, color: colorMap[verdict.variant], margin: '0 0 6px', fontFamily: 'var(--font-sans)' }}>{verdict.label}</p>
          <p style={{ fontSize: 13, color: 'var(--text-secondary)', margin: 0, lineHeight: 1.5 }}>{verdict.desc}</p>
        </div>
      );
    }

    function AiContent({ text }) {
      const lines = text.split('\n');
      const boldify = (s) => s.split(/(\*\*[^*]+\*\*)/).map((p, j) =>
        p.startsWith('**') && p.endsWith('**')
          ? <strong key={j} style={{ fontWeight: 500, color: 'var(--text-primary)' }}>{p.slice(2, -2)}</strong>
          : p
      );
      return (
        <div className="ai-section">
          {lines.map((line, i) => {
            if (!line.trim()) return <div key={i} style={{ height: 6 }} />;
            if (/^\*\*(.+)\*\*$/.test(line)) return <p key={i} className="ai-heading">{line.slice(2, -2)}</p>;
            if (line.startsWith('- ') || line.startsWith('• '))
              return <div key={i} className="bullet"><span className="bullet-dash">–</span><span>{boldify(line.slice(2))}</span></div>;
            return <p key={i}>{boldify(line)}</p>;
          })}
        </div>
      );
    }

    function App() {
      const [input, setInput]       = useState('');
      const [busy, setBusy]         = useState(false);
      const [prog, setProg]         = useState({ done: 0, total: 0, host: '' });
      const [res, setRes]           = useState(null);
      const [aiText, setAiText]     = useState('');
      const [aiLoading, setAiLoad]  = useState(false);
      const [err, setErr]           = useState('');

      const scan = useCallback(async () => {
        if (!input.trim() || busy) return;
        const d = input.trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '').toLowerCase();
        setBusy(true); setRes(null); setAiText(''); setErr('');
        const total = SUBS.length + 3;
        setProg({ done: 0, total, host: `Checking DNS metadata for ${d}` });
        try {
          const meta = { route53: false, ses: false, workmail: false };
          const [ns, txt, mx] = await Promise.all([dnsq(d, 'NS'), dnsq(d, 'TXT'), dnsq(d, 'MX')]);
          for (const r of ns)  if (/awsdns/i.test(r.data || ''))       { meta.route53   = true; break; }
          for (const r of txt) if (/amazonses\.com/i.test(r.data || ''))  meta.ses       = true;
          for (const r of mx)  if (/awsapps\.com/i.test(r.data || ''))    meta.workmail  = true;

          const findings = [];
          let done = 3;
          await Promise.all(SUBS.map(async sub => {
            const host = sub ? `${sub}.${d}` : d;
            setProg(p => ({ ...p, done, host }));
            const recs = await dnsq(host, 'CNAME');
            for (const r of recs) {
              const cname = (r.data || '').replace(/\.$/, '');
              for (const fp of FPS) {
                if (fp.re.test(cname)) { findings.push({ subdomain: sub || '@', hostname: host, cname, ...fp }); break; }
              }
            }
            done++;
            setProg(p => ({ ...p, done }));
          }));

          const verdict = scoreIt(findings);
          setRes({ domain: d, findings, meta, verdict });

          if (findings.length || meta.route53 || meta.ses) {
            setAiLoad(true);
            getAI(d, findings, meta)
              .then(setAiText)
              .catch(() => setAiText('AI analysis unavailable.'))
              .finally(() => setAiLoad(false));
          }
        } catch (e) {
          setErr('Scan failed — check the domain format and try again.');
        }
        setBusy(false);
      }, [input, busy]);

      const pct = prog.total ? Math.round(prog.done / prog.total * 100) : 0;

      return (
        <div>
          {/* Header */}
          <div style={{ marginBottom: '2rem' }}>
            <p className="label-mono" style={{ marginBottom: 8 }}>Render sales tooling</p>
            <h1 style={{ fontSize: 28, fontWeight: 600, margin: '0 0 8px', letterSpacing: '-0.02em' }}>AWS stack fingerprinter</h1>
            <p style={{ fontSize: 14, color: 'var(--text-secondary)', margin: 0, lineHeight: 1.5 }}>
              Identifies AWS services from public DNS to qualify migration prospects before the first call.
              Scans {SUBS.length} subdomains + NS / TXT / MX metadata.
            </p>
          </div>

          {/* Input */}
          <div style={{ display: 'flex', gap: 8, marginBottom: '1.5rem' }}>
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && scan()}
              placeholder="e.g. stripe.com"
              disabled={busy}
            />
            <button onClick={scan} disabled={busy || !input.trim()} style={{ minWidth: 100 }}>
              <i className={`ti ${busy ? 'ti-loader spin' : 'ti-radar'}`} style={{ fontSize: 15 }} />
              {busy ? 'Scanning' : 'Scan'}
            </button>
          </div>

          {/* Progress */}
          {busy && (
            <div style={{ marginBottom: '1.5rem' }}>
              <div style={{ height: 2, background: 'var(--border-med)', borderRadius: 2, marginBottom: 8, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${pct}%`, background: 'var(--info-text)', borderRadius: 2, transition: 'width 0.15s ease' }} />
              </div>
              <p className="pulse" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-tertiary)', display: 'flex', alignItems: 'center', gap: 6 }}>
                <i className="ti ti-radar" style={{ fontSize: 11 }} />
                {prog.host}
              </p>
            </div>
          )}

          {/* Error */}
          {err && (
            <div style={{ padding: '10px 14px', borderRadius: 'var(--radius-md)', border: '0.5px solid var(--danger-border)', background: 'var(--danger-bg)', color: 'var(--danger-text)', fontSize: 13, marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: 8 }}>
              <i className="ti ti-alert-circle" style={{ fontSize: 15 }} />{err}
            </div>
          )}

          {/* Results */}
          {res && (
            <div>
              <VerdictCard verdict={res.verdict} />

              {/* Metadata chips */}
              {(res.meta.route53 || res.meta.ses || res.meta.workmail) && (
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
                  {res.meta.route53   && <span className="chip"><i className="ti ti-cloud"   style={{ fontSize: 13 }} />Route 53 DNS detected</span>}
                  {res.meta.ses       && <span className="chip"><i className="ti ti-mail"    style={{ fontSize: 13 }} />AWS SES (email)</span>}
                  {res.meta.workmail  && <span className="chip"><i className="ti ti-mail"    style={{ fontSize: 13 }} />WorkMail</span>}
                </div>
              )}

              {/* Findings table */}
              {res.findings.length > 0 ? (
                <div className="card" style={{ marginBottom: 10, overflow: 'hidden' }}>
                  <div style={{ padding: '10px 16px', borderBottom: '0.5px solid var(--border)' }}>
                    <p style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-secondary)', margin: 0 }}>
                      Detected services <span style={{ color: 'var(--text-tertiary)', fontWeight: 400 }}>({res.findings.length})</span>
                    </p>
                  </div>
                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ tableLayout: 'fixed', minWidth: 520 }}>
                      <colgroup>
                        <col style={{ width: '14%' }} /><col style={{ width: '24%' }} /><col style={{ width: '13%' }} /><col style={{ width: '49%' }} />
                      </colgroup>
                      <thead>
                        <tr>
                          {['Subdomain','Service','Difficulty','Migration notes'].map(h => <th key={h}>{h}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {res.findings.map((f, i) => (
                          <tr key={`${f.hostname}-${f.id}`}>
                            <td style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.subdomain}</td>
                            <td style={{ fontWeight: 500, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</td>
                            <td><Badge diff={f.diff} /></td>
                            <td style={{ color: 'var(--text-secondary)', fontSize: 12 }}>{f.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              ) : !res.meta.route53 && !res.meta.ses ? (
                <div style={{ padding: '2.5rem', textAlign: 'center', color: 'var(--text-tertiary)', fontSize: 13, border: '0.5px solid var(--border)', borderRadius: 'var(--radius-lg)', marginBottom: 10 }}>
                  <i className="ti ti-search-off" style={{ fontSize: 24, display: 'block', margin: '0 auto 8px' }} />
                  No AWS fingerprints detected in public DNS.
                </div>
              ) : null}

              {/* AI analysis */}
              {(aiText || aiLoading) && (
                <div className="card" style={{ padding: '1rem 1.25rem', marginBottom: 10 }}>
                  <p className="label-mono" style={{ marginBottom: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
                    <i className="ti ti-sparkles" style={{ fontSize: 11 }} />AI sales analysis
                  </p>
                  {aiLoading
                    ? <p style={{ fontSize: 13, color: 'var(--text-tertiary)', display: 'flex', alignItems: 'center', gap: 6 }}>
                        <i className="ti ti-loader spin" style={{ fontSize: 13 }} />Analyzing stack...
                      </p>
                    : <AiContent text={aiText} />
                  }
                </div>
              )}

              {/* Footer note */}
              <p style={{ fontSize: 11, color: 'var(--text-tertiary)', lineHeight: 1.6, marginTop: '1rem', display: 'flex', gap: 6 }}>
                <i className="ti ti-info-circle" style={{ fontSize: 12, marginTop: 1, flexShrink: 0 }} />
                DNS-only scan. Private AWS services (RDS, ECS/Fargate, SQS, ElastiCache) don't surface in DNS — HTTP header analysis via a backend proxy is needed for full stack visibility. Route 53 detection alone is a strong AWS dependency signal.
              </p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
