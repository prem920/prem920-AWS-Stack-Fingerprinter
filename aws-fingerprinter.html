<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Stack Fingerprinter — Render</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.08); --border-med: rgba(255,255,255,0.14);
      --text: #f0f0f0; --text-2: #a0a0a0; --text-3: #555;
      --mono: 'JetBrains Mono', monospace; --sans: 'DM Sans', system-ui, sans-serif;
      --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
      --green-bg:#0a1f0f; --green-b:rgba(34,197,94,.25); --green:#4ade80;
      --yellow-bg:#1a1200; --yellow-b:rgba(234,179,8,.25); --yellow:#facc15;
      --red-bg:#190808; --red-b:rgba(239,68,68,.25); --red:#f87171;
      --blue-bg:#071323; --blue-b:rgba(96,165,250,.25); --blue:#93c5fd;
    }
    html, body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.6; min-height:100vh; }
    #app { max-width:820px; margin:0 auto; padding:2.5rem 1.5rem 5rem; }
    .label { font-family:var(--mono); font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
    h1 { font-size:28px; font-weight:600; letter-spacing:-.02em; margin-bottom:8px; }
    .subtitle { font-size:14px; color:var(--text-2); line-height:1.5; margin-bottom:2rem; }
    .input-row { display:flex; gap:8px; margin-bottom:1.5rem; }
    input[type=text] {
      flex:1; background:var(--surface); border:.5px solid var(--border-med);
      border-radius:var(--r-md); color:var(--text); font-family:var(--mono);
      font-size:13px; padding:0 14px; height:40px; outline:none;
    }
    input::placeholder { color:var(--text-3); }
    input:focus { box-shadow:0 0 0 3px rgba(255,255,255,.04); }
    input:disabled { opacity:.5; }
    button {
      background:transparent; border:.5px solid var(--border-med); border-radius:var(--r-md);
      color:var(--text); font-family:var(--sans); font-size:13px; font-weight:500;
      height:40px; padding:0 20px; cursor:pointer; white-space:nowrap; transition:background .1s;
    }
    button:hover:not(:disabled) { background:rgba(255,255,255,.05); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    #progress { margin-bottom:1.5rem; display:none; }
    .prog-bar-wrap { height:2px; background:var(--border-med); border-radius:2px; margin-bottom:8px; overflow:hidden; }
    .prog-bar { height:100%; width:0; background:var(--blue); border-radius:2px; transition:width .15s ease; }
    .prog-label { font-family:var(--mono); font-size:11px; color:var(--text-3); }
    #error { display:none; padding:10px 14px; border-radius:var(--r-md); border:.5px solid var(--red-b); background:var(--red-bg); color:var(--red); font-size:13px; margin-bottom:1rem; }
    #results { display:none; }
    .verdict { border-radius:var(--r-lg); padding:1rem 1.25rem; margin-bottom:10px; }
    .verdict .v-score { font-size:22px; font-weight:500; margin:4px 0 6px; }
    .verdict .v-desc { font-size:13px; line-height:1.5; color:var(--text-2); }
    .verdict.success { background:var(--green-bg); border:.5px solid var(--green-b); }
    .verdict.success .v-score { color:var(--green); }
    .verdict.warning { background:var(--yellow-bg); border:.5px solid var(--yellow-b); }
    .verdict.warning .v-score { color:var(--yellow); }
    .verdict.danger { background:var(--red-bg); border:.5px solid var(--red-b); }
    .verdict.danger .v-score { color:var(--red); }
    .verdict.neutral { background:var(--surface2); border:.5px solid var(--border); }
    .verdict.neutral .v-score { color:var(--text-3); }
    .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .chip { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:var(--r-sm); font-size:12px; background:var(--blue-bg); border:.5px solid var(--blue-b); color:var(--blue); }
    .card { background:var(--surface); border:.5px solid var(--border); border-radius:var(--r-lg); overflow:hidden; margin-bottom:10px; }
    .card-header { padding:10px 16px; border-bottom:.5px solid var(--border); font-size:12px; font-weight:500; color:var(--text-2); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { padding:8px 16px; text-align:left; font-size:10px; font-weight:400; color:var(--text-3); text-transform:uppercase; letter-spacing:.06em; border-bottom:.5px solid var(--border); }
    td { padding:10px 16px; border-bottom:.5px solid var(--border); vertical-align:top; line-height:1.4; }
    tr:last-child td { border-bottom:none; }
    .td-mono { font-family:var(--mono); font-size:12px; color:var(--text); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .td-name { font-weight:500; color:var(--text); }
    .td-note { color:var(--text-2); font-size:12px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:var(--r-sm); font-size:11px; font-weight:500; font-family:var(--mono); }
    .badge-easy { background:var(--green-bg); border:.5px solid var(--green-b); color:var(--green); }
    .badge-medium { background:var(--yellow-bg); border:.5px solid var(--yellow-b); color:var(--yellow); }
    .badge-hard { background:var(--red-bg); border:.5px solid var(--red-b); color:var(--red); }
    .empty { padding:2.5rem; text-align:center; color:var(--text-3); font-size:13px; border:.5px solid var(--border); border-radius:var(--r-lg); margin-bottom:10px; }
    .footer-note { font-size:11px; color:var(--text-3); line-height:1.6; margin-top:1rem; }
  </style>
</head>
<body>
<div id="app">
  <p class="label">Render sales tooling</p>
  <h1>AWS stack fingerprinter</h1>
  <p class="subtitle">Identifies AWS services from public DNS to qualify migration prospects before the first call. Scans 18 subdomains + NS / TXT / MX metadata.</p>

  <div class="input-row">
    <input type="text" id="domain-input" placeholder="e.g. stripe.com" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button id="scan-btn" onclick="startScan()">Scan</button>
  </div>

  <div id="progress">
    <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar"></div></div>
    <p class="prog-label" id="prog-label"></p>
  </div>

  <div id="error"></div>
  <div id="results"></div>
</div>

<script>
const FPS = [
  { id:'beanstalk',   re:/\.elasticbeanstalk\.com/i,                  name:'Elastic Beanstalk',  diff:'easy',   note:'Direct PaaS swap. Top priority migration profile.' },
  { id:'amplify',     re:/\.amplifyapp\.com/i,                         name:'AWS Amplify',        diff:'easy',   note:'Managed hosting layer — strong Render candidate.' },
  { id:'s3static',    re:/s3-website/i,                                name:'S3 Static Hosting',  diff:'easy',   note:'Clean migration to Render static sites.' },
  { id:'lightsail',   re:/lightsail/i,                                 name:'Lightsail',          diff:'easy',   note:'AWS managed VPS. Simple migration path.' },
  { id:'alb',         re:/\.elb\.amazonaws\.com/i,                     name:'ELB / ALB',          diff:'easy',   note:'Load balancer visible. Investigate compute behind it.' },
  { id:'s3',          re:/\.s3\.amazonaws\.com/i,                      name:'S3',                 diff:'easy',   note:'Likely static hosting or CDN origin.' },
  { id:'cloudfront',  re:/\.cloudfront\.net/i,                         name:'CloudFront',         diff:'medium', note:'CDN layer — identify origin to qualify.' },
  { id:'apigateway',  re:/\.execute-api\.[a-z0-9-]+\.amazonaws\.com/i, name:'API Gateway',        diff:'hard',   note:'Lambda-backed. No Render serverless equivalent.' },
  { id:'eks',         re:/\.eks\.amazonaws\.com/i,                     name:'EKS (Kubernetes)',   diff:'hard',   note:'Active K8s investment. Not a near-term target.' },
  { id:'globalaccel', re:/\.awsglobalaccelerator\.com/i,               name:'Global Accelerator', diff:'hard',   note:"Multi-region active/active. Render doesn't support this." },
  { id:'awsgeneric',  re:/\.amazonaws\.com/i,                          name:'AWS (unspecified)',  diff:'medium', note:'Generic AWS resource. Needs discovery call to identify.' },
];

const SUBS = ['','www','api','app','portal','admin','staging','dev','prod','backend','static','cdn','assets','auth','secure','worker','jobs','media'];

let busy = false;

async function dnsq(name, type) {
  try {
    const r = await fetch('https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(name) + '&type=' + type, { headers: { Accept: 'application/dns-json' } });
    if (!r.ok) return [];
    return (await r.json()).Answer || [];
  } catch(e) { return []; }
}

function scoreIt(findings) {
  const has = function(id) { return findings.some(function(f) { return f.id === id; }); };
  const any = function(d)  { return findings.some(function(f) { return f.diff === d; }); };
  if (!findings.length)                return { label:'No AWS detected',   cls:'neutral', desc:'No AWS fingerprints found in public DNS. May use a different cloud, or CDN obfuscation is hiding the stack.' };
  if (has('beanstalk'))                return { label:'Prime target',       cls:'success', desc:'Elastic Beanstalk confirmed — direct PaaS-to-PaaS swap. Highest priority migration profile.' };
  if (has('eks') || has('globalaccel'))return { label:'Poor fit',           cls:'danger',  desc:'Kubernetes or multi-region infrastructure detected. Migration requires significant re-architecture.' };
  if (has('apigateway') && !any('easy'))return { label:'Poor fit',          cls:'danger',  desc:'API Gateway detected — likely serverless-first stack. No Render equivalent for Lambda.' };
  if (any('hard') && any('easy'))      return { label:'Investigate',        cls:'warning', desc:'Mixed signals — easy wins alongside hard blockers. Discovery call needed to understand full compute layer.' };
  if (any('easy') && !any('hard'))     return { label:'Strong candidate',   cls:'success', desc:'Clean migration profile. Mostly replaceable AWS services visible in public DNS.' };
  return                                      { label:'Investigate',        cls:'warning', desc:"AWS confirmed but compute layer isn't exposed in DNS. Run a discovery call." };
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setProgress(done, total, host) {
  document.getElementById('prog-bar').style.width = total ? Math.round(done/total*100) + '%' : '0%';
  document.getElementById('prog-label').textContent = host;
}

function renderResults(domain, findings, meta) {
  var verdict = scoreIt(findings);

  var chips = '';
  if (meta.route53)  chips += '<span class="chip">Route 53 DNS detected</span>';
  if (meta.ses)      chips += '<span class="chip">AWS SES (email)</span>';
  if (meta.workmail) chips += '<span class="chip">WorkMail</span>';

  var tableHtml = '';
  if (findings.length) {
    var rows = findings.map(function(f) {
      return '<tr>' +
        '<td class="td-mono">' + esc(f.subdomain) + '</td>' +
        '<td class="td-name">' + esc(f.name) + '</td>' +
        '<td><span class="badge badge-' + f.diff + '">' + f.diff + '</span></td>' +
        '<td class="td-note">' + esc(f.note) + '</td>' +
        '</tr>';
    }).join('');
    tableHtml = '<div class="card">' +
      '<div class="card-header">Detected services <span style="color:var(--text-3);font-weight:400">(' + findings.length + ')</span></div>' +
      '<div style="overflow-x:auto"><table>' +
      '<colgroup><col style="width:13%"><col style="width:25%"><col style="width:12%"><col style="width:50%"></colgroup>' +
      '<thead><tr><th>Subdomain</th><th>Service</th><th>Difficulty</th><th>Migration notes</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  } else if (!meta.route53 && !meta.ses) {
    tableHtml = '<div class="empty">No AWS fingerprints detected in public DNS.</div>';
  }

  document.getElementById('results').innerHTML =
    '<div class="verdict ' + verdict.cls + '">' +
      '<p class="label">Migration readiness &mdash; ' + esc(domain) + '</p>' +
      '<p class="v-score">' + verdict.label + '</p>' +
      '<p class="v-desc">' + verdict.desc + '</p>' +
    '</div>' +
    (chips ? '<div class="chips">' + chips + '</div>' : '') +
    tableHtml +
    '<p class="footer-note">DNS-only scan. Private AWS services (RDS, ECS/Fargate, SQS, ElastiCache) do not surface in DNS. Route 53 detection alone is a strong AWS dependency signal.</p>';

  document.getElementById('results').style.display = 'block';
}

async function startScan() {
  if (busy) return;
  var raw = document.getElementById('domain-input').value.trim();
  if (!raw) return;
  var domain = raw.replace(/^https?:\/\//i,'').replace(/\/.*$/,'').toLowerCase();

  busy = true;
  document.getElementById('scan-btn').disabled = true;
  document.getElementById('scan-btn').textContent = 'Scanning...';
  document.getElementById('domain-input').disabled = true;
  document.getElementById('error').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('progress').style.display = 'block';

  var total = SUBS.length + 3;
  setProgress(0, total, 'Checking DNS metadata for ' + domain);

  try {
    var meta = { route53: false, ses: false, workmail: false };
    var nsRes  = await dnsq(domain, 'NS');
    var txtRes = await dnsq(domain, 'TXT');
    var mxRes  = await dnsq(domain, 'MX');

    nsRes.forEach(function(r)  { if (/awsdns/i.test(r.data||''))         meta.route53  = true; });
    txtRes.forEach(function(r) { if (/amazonses\.com/i.test(r.data||'')) meta.ses      = true; });
    mxRes.forEach(function(r)  { if (/awsapps\.com/i.test(r.data||''))  meta.workmail = true; });

    var findings = [];
    var done = 3;

    await Promise.all(SUBS.map(async function(sub) {
      var host = sub ? sub + '.' + domain : domain;
      setProgress(done, total, host);
      var recs = await dnsq(host, 'CNAME');
      recs.forEach(function(r) {
        var cname = (r.data||'').replace(/\.$/,'');
        for (var i = 0; i < FPS.length; i++) {
          if (FPS[i].re.test(cname)) {
            findings.push(Object.assign({ subdomain: sub||'@', hostname: host, cname: cname }, FPS[i]));
            break;
          }
        }
      });
      done++;
      setProgress(done, total, host);
    }));

    document.getElementById('progress').style.display = 'none';
    renderResults(domain, findings, meta);

  } catch(e) {
    document.getElementById('error').textContent = 'Scan failed — check the domain format and try again.';
    document.getElementById('error').style.display = 'block';
    document.getElementById('progress').style.display = 'none';
  }

  busy = false;
  document.getElementById('scan-btn').disabled = false;
  document.getElementById('scan-btn').textContent = 'Scan';
  document.getElementById('domain-input').disabled = false;
}

document.getElementById('domain-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') startScan();
});
</script>
</body>
</html>
